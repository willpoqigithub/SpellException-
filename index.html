<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPELL EXCEPTION</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(160deg, #fff0f5 0%, #ffe4ec 40%, #ffd6e7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 20px;
      color: #c2185b;
      overflow-x: hidden;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      margin-bottom: 12px;
      text-align: center;
      color: #ad1457;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1rem;
      color: #e91e63;
      margin-bottom: 35px;
      opacity: 0.85;
    }

    .word-display {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      letter-spacing: 10px;
      margin-bottom: 40px;
      color: #c2185b;
      min-height: 55px;
      font-weight: bold;
      transition: all 0.3s ease;
      text-shadow: 0 2px 8px rgba(194, 24, 91, 0.15);
    }

    .word-display.correct {
      color: #e91e63;
      transform: scale(1.05);
      text-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
    }

    .word-display.wrong {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 7px;
      max-width: 520px;
      width: 100%;
      margin-bottom: 18px;
    }

    .key {
      background: #ff80ab;
      border: none;
      border-radius: 12px;
      padding: 13px 0;
      text-align: center;
      font-size: 1.1rem;
      color: white;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      box-shadow: 0 4px 0 #f06292;
      font-family: inherit;
    }

    .key:hover {
      background: #ff6b9d;
      transform: translateY(-2px);
    }

    .key:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f06292;
    }

    .key.special {
      background: #c2185b;
      box-shadow: 0 4px 0 #880e4f;
      font-size: 0.95rem;
    }

    .key.special:hover {
      background: #ad1457;
    }

    .key.special:active {
      box-shadow: 0 1px 0 #880e4f;
    }

    .enter {
      grid-column: span 2;
    }

    .backspace {
      grid-column: span 2;
    }

    .message {
      margin-top: 18px;
      font-size: 1.15rem;
      color: #ad1457;
      height: 28px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .message.success {
      color: #e91e63;
      font-weight: 600;
    }

    /* Video Overlay */
    #videoContainer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 100;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #videoContainer video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #ff80ab;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      z-index: 101;
      box-shadow: 0 4px 15px rgba(0,0,0,0.35);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .close-btn:hover {
      background: #ff6b9d;
      transform: scale(1.05);
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 2.5s ease-out forwards;
      z-index: 50;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-120px) scale(0.6);
      }
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .keyboard {
        gap: 5px;
      }
      .key {
        padding: 11px 0;
        font-size: 0.95rem;
        border-radius: 9px;
      }
      .word-display {
        letter-spacing: 6px;
      }
    }
  </style>
</head>
<body>

  <h1>Spell "EXCEPTION"</h1>
  <p class="subtitle">Type the word correctly ✨</p>

  <div class="word-display" id="display">_ _ _ _ _ _ _ _ _</div>

  <div class="keyboard" id="keyboard"></div>

  <div class="message" id="message"></div>

  <!-- Video -->
  <div id="videoContainer">
    <button class="close-btn" onclick="closeVideo()">Close ♡</button>
    <video id="vid" controls playsinline>
      <source src="Video.mp4" type="video/mp4">
    </video>
  </div>

  <script>
    const target = "EXCEPTION";
    let current = "";

    const display = document.getElementById("display");
    const message = document.getElementById("message");
    const keyboard = document.getElementById("keyboard");
    const videoContainer = document.getElementById("videoContainer");
    const vid = document.getElementById("vid");

    // Create letter keys
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    letters.forEach(letter => {
      const btn = document.createElement("button");
      btn.className = "key";
      btn.textContent = letter;
      btn.onclick = () => press(letter);
      keyboard.appendChild(btn);
    });

    // Backspace button
    const backspace = document.createElement("button");
    backspace.className = "key special backspace";
    backspace.textContent = "⌫";
    backspace.onclick = () => {
      current = current.slice(0, -1);
      updateDisplay();
      message.textContent = "";
      display.classList.remove("wrong", "correct");
    };
    keyboard.appendChild(backspace);

    // Enter button
    const enter = document.createElement("button");
    enter.className = "key special enter";
    enter.textContent = "ENTER";
    enter.onclick = check;
    keyboard.appendChild(enter);

    function press(letter) {
      if (current.length < target.length) {
        current += letter;
        updateDisplay();
        message.textContent = "";
        display.classList.remove("wrong", "correct");
      }
    }

    function updateDisplay() {
      let shown = "";
      for (let i = 0; i < target.length; i++) {
        shown += (current[i] || "_") + " ";
      }
      display.textContent = shown.trim();
    }

    function check() {
      if (current === target) {
        message.textContent = "Correct! ♡";
        message.classList.add("success");
        display.classList.add("correct");
        createHearts();
        
        setTimeout(() => {
          videoContainer.style.display = "block";
          vid.play().catch(() => {});
        }, 600);
      } else {
        message.textContent = "Wrong, try again ♡";
        message.classList.remove("success");
        display.classList.add("wrong");
        
        setTimeout(() => {
          current = "";
          updateDisplay();
          display.classList.remove("wrong");
        }, 500);
      }
    }

    function closeVideo() {
      vid.pause();
      vid.currentTime = 0;
      videoContainer.style.display = "none";
      current = "";
      updateDisplay();
      message.textContent = "";
      message.classList.remove("success");
      display.classList.remove("correct");
    }

    function createHearts() {
      for (let i = 0; i < 12; i++) {
        setTimeout(() => {
          const heart = document.createElement("div");
          heart.className = "heart";
          heart.textContent = "♡";
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.top = (60 + Math.random() * 20) + "vh";
          heart.style.color = `hsl(${330 + Math.random() * 30}, 80%, 65%)`;
          heart.style.fontSize = (16 + Math.random() * 18) + "px";
          document.body.appendChild(heart);
          
          setTimeout(() => heart.remove(), 2500);
        }, i * 80);
      }
    }

    // Physical keyboard support
    document.addEventListener("keydown", (e) => {
      const key = e.key.toUpperCase();
      
      if (key >= "A" && key <= "Z") {
        press(key);
      }
      if (e.key === "Enter") {
        check();
      }
      if (e.key === "Backspace") {
        current = current.slice(0, -1);
        updateDisplay();
        message.textContent = "";
        display.classList.remove("wrong", "correct");
      }
    });
  </script>
</body>
  </html>
